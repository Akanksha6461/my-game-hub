<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Little Magic Garden</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#c9f1f2;font-family:system-ui,sans-serif;color:#40555b}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}header{position:fixed;top:25px;left:30px;pointer-events:none}header small{font-weight:800;letter-spacing:3px;font-size:11px;color:#5d8986}h1{font-size:clamp(25px,5vw,46px);letter-spacing:-2px;margin:3px 0}header p{font-size:14px;margin:6px 0;color:#527b7d}.toolbar{position:fixed;bottom:23px;left:50%;transform:translateX(-50%);display:flex;gap:9px;padding:10px;background:#ffffffc9;border:1px solid #fff;border-radius:24px;box-shadow:0 8px 35px #4a8d6c22;backdrop-filter:blur(15px)}button{border:0;background:transparent;padding:10px 16px;border-radius:17px;cursor:pointer;font:700 13px system-ui;color:#506c64;white-space:nowrap;transition:transform .2s,background .2s}button span{font-size:27px;display:block;margin-bottom:3px}button:hover{transform:translateY(-4px);background:#fff}button.active{background:#fbe6a8;color:#715523}button:focus-visible{outline:3px solid #8b74d7}.topbuttons{position:fixed;right:22px;top:23px;display:flex;gap:7px}.topbuttons button{background:#ffffffa8;padding:10px 14px}.hint{position:fixed;bottom:135px;width:100%;text-align:center;pointer-events:none;font-size:13px;color:#4f776c}.bubble{position:fixed;top:42%;width:100%;text-align:center;font-size:clamp(26px,5vw,50px);font-weight:800;color:#fff;text-shadow:0 3px 20px #7f92b3;pointer-events:none;opacity:0;transition:opacity .5s}.bubble.show{opacity:1}@media(max-width:600px){header{left:20px;top:18px}header p{max-width:220px;font-size:12px}.topbuttons{top:108px;right:15px}.toolbar{gap:0;padding:7px;bottom:16px}button{padding:10px 11px;font-size:11px}button span{font-size:25px}.hint{bottom:125px;font-size:12px}}
header{max-width:calc(100% - 40px)}.toolbar{max-width:calc(100% - 24px);padding-bottom:max(8px,env(safe-area-inset-bottom));bottom:12px}button{min-height:44px}.toolbar button{min-width:0;flex:1}.topbuttons{z-index:2}.hint{padding:0 16px}@media(max-width:600px){header{top:16px;left:16px}header h1{font-size:26px;letter-spacing:-1px}header p{font-size:12px;max-width:none}.topbuttons{left:16px;right:auto;top:112px}.topbuttons button{font-size:12px;padding:9px 12px}.toolbar{width:calc(100% - 24px);border-radius:18px;gap:0}.toolbar button{padding:8px 3px;font-size:10px}.toolbar button span{font-size:23px}.hint{bottom:155px;font-size:11px}body>a{right:12px!important;bottom:105px!important;padding:9px 12px!important}}@media(max-height:450px){header p,.hint{display:none}.topbuttons{top:8px;right:8px;left:auto}.toolbar{bottom:8px}.toolbar button span{display:inline;font-size:18px}.toolbar button{padding:6px}body>a{bottom:75px!important}} </style></head><body><a href="../" style="position:fixed;right:22px;bottom:100px;z-index:5;background:#ffffffd9;color:#40555b;padding:10px 14px;border-radius:14px;font:700 12px system-ui;text-decoration:none">← All games</a><canvas aria-label="Interactive magic garden. Choose a tool and tap or drag to create flowers, butterflies, sparkles, or rainbows."></canvas><header><small>A TINY WORLD OF WONDER</small><h1>My Little Magic Garden 🌷</h1><p>A little tap. A little magic. Something beautiful.</p></header><div class="topbuttons"><button id="sound" aria-pressed="false">♫ Sound off</button><button id="clear">↻ Start fresh</button></div><div class="hint" id="hint">Tap anywhere to grow a happy flower!</div><div class="bubble" id="bubble"></div><nav class="toolbar" aria-label="Garden tools"><button class="active" data-tool="flower" aria-pressed="true"><span>🌸</span>Flowers</button><button data-tool="butterfly" aria-pressed="false"><span>🦋</span>Butterflies</button><button data-tool="sparkle" aria-pressed="false"><span>✨</span>Sparkles</button><button data-tool="rainbow" aria-pressed="false"><span>🌈</span>Rainbow</button></nav><script>
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d');let w,h,dpr,tool='flower',flowers=[],flies=[],stars=[],rainbows=[],time=0,last=0,down=false,lastPlant=0,count=0,sound=false,audio=null,toastTimer;
const colors=['#ff8db0','#ba97ed','#ffcb69','#f99177','#8ecded','#e6a3df'];
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;c.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
function pick(a){return a[Math.floor(Math.random()*a.length)]}function circle(x,y,r,color){c.fillStyle=color;c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill()}function ellipse(x,y,rx,ry,angle,color){c.fillStyle=color;c.beginPath();c.ellipse(x,y,rx,ry,angle,0,Math.PI*2);c.fill()}
function note(){if(!sound||!audio)return;audio.resume();const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.value=pick([261.63,329.63,392,523.25,659.25,783.99]);gain.gain.setValueAtTime(.0001,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.12,audio.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.7);osc.connect(gain);gain.connect(audio.destination);osc.start();osc.stop(audio.currentTime+.75)}
document.querySelector('#sound').onclick=()=>{if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audio=new AC()}sound=!sound;document.querySelector('#sound').textContent=sound?'♫ Sound on':'♫ Sound off';document.querySelector('#sound').setAttribute('aria-pressed',sound);if(sound)note()};
const hints={flower:'Tap anywhere to grow a happy flower!',butterfly:'Tap to release a butterfly. Watch it dance!',sparkle:'Drag your finger to paint a sparkling trail!',rainbow:'Tap to put a little rainbow in your sky!'};
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(q=>{q.classList.toggle('active',q===b);q.setAttribute('aria-pressed',q===b)});document.querySelector('#hint').textContent=hints[tool]});
function sparkle(x,y,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=20+Math.random()*100;stars.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1+Math.random(),max:2,size:3+Math.random()*6,color:pick(colors)})}if(stars.length>650)stars.splice(0,stars.length-650)}
function create(x,y,quiet=false){if(tool==='flower'){flowers.push({x:x/w,y:Math.min(y,h-110)/h,size:22+Math.random()*17,stem:40+Math.random()*65,color:pick(colors),born:time,phase:Math.random()*6});if(flowers.length>150)flowers.shift();sparkle(x,y,9)}if(tool==='butterfly'){flies.push({x,y,vx:Math.random()*50-25,phase:Math.random()*6,color:pick(colors),size:10+Math.random()*8});if(flies.length>60)flies.shift();sparkle(x,y,10)}if(tool==='sparkle')sparkle(x,y,6);if(tool==='rainbow'){rainbows.push({x:x/w,y:y/h,r:Math.min(w*.35,160),born:time});if(rainbows.length>8)rainbows.shift();sparkle(x,y,20)}if(!quiet){note();count++;if(count%15===0){const b=document.querySelector('#bubble');b.textContent=pick(['You make the world brighter! ✨','Look at your lovely garden! 🌸','A little magic, made by you! 🦋']);b.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>b.classList.remove('show'),2400)}}}
canvas.addEventListener('pointerdown',e=>{down=true;canvas.setPointerCapture(e.pointerId);create(e.clientX,e.clientY);lastPlant=time});canvas.addEventListener('pointermove',e=>{if(down&&time-lastPlant>(tool==='sparkle'?.025:.18)){create(e.clientX,e.clientY,tool==='sparkle');lastPlant=time}});for(const event of ['pointerup','pointercancel'])canvas.addEventListener(event,()=>down=false);
function seed(){flowers=[];flies=[];stars=[];rainbows=[];count=0;for(let i=0;i<12;i++)flowers.push({x:.05+i*.08,y:.73+Math.sin(i*2)*.06,size:22+Math.random()*11,stem:55,color:colors[i%colors.length],born:time-2,phase:i});for(let i=0;i<5;i++)flies.push({x:w*(.15+i*.17),y:h*.42,vx:20,phase:i*2,color:colors[i],size:13})}document.querySelector('#clear').onclick=seed;seed();
function draw(dt){time+=dt;const sky=c.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#bfeaf4');sky.addColorStop(.65,'#e8f5d6');sky.addColorStop(1,'#e7efd1');c.fillStyle=sky;c.fillRect(0,0,w,h);
const sx=w*.79,sy=h*.23;circle(sx,sy,48,'#fff2b4');for(let i=0;i<12;i++){let a=i*Math.PI/6+time*.08;c.strokeStyle='#fff1b8';c.lineWidth=5;c.lineCap='round';c.beginPath();c.moveTo(sx+Math.cos(a)*59,sy+Math.sin(a)*59);c.lineTo(sx+Math.cos(a)*70,sy+Math.sin(a)*70);c.stroke()}circle(sx-13,sy-2,3,'#ad885e');circle(sx+13,sy-2,3,'#ad885e');c.strokeStyle='#ad885e';c.lineWidth=2;c.beginPath();c.arc(sx,sy+5,10,.15,Math.PI-.15);c.stroke();
for(let i=0;i<5;i++){const x=((i*w*.28+time*9)%(w+220))-110,y=h*(.24+(i%3)*.10);ellipse(x,y,57,18,0,'#ffffffb0');circle(x-20,y-10,23,'#ffffffb0');circle(x+12,y-17,29,'#ffffffb0')}
for(const r of rainbows){const age=time-r.born,alpha=Math.min(1,age*2)*Math.min(1,(25-age)/3);if(alpha<=0)continue;c.globalAlpha=alpha*.8;['#fb98ab','#ffc17e','#ffe49a','#a9dbad','#8bcde4','#bca4e6'].forEach((color,i)=>{c.strokeStyle=color;c.lineWidth=10;c.beginPath();c.arc(r.x*w,r.y*h,r.r-i*10,Math.PI,Math.PI*2);c.stroke()});c.globalAlpha=1}rainbows=rainbows.filter(r=>time-r.born<25);
ellipse(w*.2,h*1.06,w*.8,h*.4,0,'#b7dca6');ellipse(w*.88,h*1.12,w*.7,h*.42,0,'#9dce9d');for(let i=0;i<35;i++){const x=(i*127)%w,y=h*.79+(i*43)%(Math.max(1,h*.21));circle(x,y,2,'#e8efbc')}
for(const f of flowers){const grow=Math.min(1,(time-f.born)*2.5),x=f.x*w,y=f.y*h,lean=Math.sin(time*1.4+f.phase)*5;c.save();c.translate(x,y+f.stem);c.scale(grow,grow);c.strokeStyle='#69a979';c.lineWidth=4;c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-lean,-f.stem*.5,lean,-f.stem);c.stroke();ellipse(-10,-f.stem*.35,15,6,.5,'#7ab987');ellipse(11,-f.stem*.6,16,6,-.5,'#88c58c');for(let j=0;j<6;j++){const a=j*Math.PI/3+Math.sin(time*.5+f.phase)*.07;ellipse(lean+Math.cos(a)*f.size*.6,-f.stem+Math.sin(a)*f.size*.6,f.size*.48,f.size*.31,a,f.color)}circle(lean,-f.stem,f.size*.33,'#ffe29a');circle(lean-4,-f.stem-1,1.6,'#9d7c52');circle(lean+4,-f.stem-1,1.6,'#9d7c52');c.strokeStyle='#9d7c52';c.lineWidth=1.3;c.beginPath();c.arc(lean,-f.stem+2,4,0,Math.PI);c.stroke();c.restore()}
for(const b of flies){b.x+=(b.vx+Math.sin(time+b.phase)*25)*dt;b.y+=Math.cos(time*1.4+b.phase)*20*dt;if(b.x>w+30)b.x=-25;if(b.x< -35)b.x=w+25;b.y=Math.max(140,Math.min(h-130,b.y));const flap=.25+Math.abs(Math.sin(time*11+b.phase))*.75;c.save();c.translate(b.x,b.y);c.rotate(Math.sin(time+b.phase)*.2);for(const s of [-1,1]){ellipse(s*b.size*.65*flap,-5,b.size*flap,b.size*.85,s*.4,b.color);ellipse(s*b.size*.5*flap,8,b.size*.65*flap,b.size*.6,-s*.4,b.color);circle(s*b.size*.8*flap,-7,3,'#ffffffb0')}ellipse(0,0,2.5,b.size*.7,0,'#67728a');c.strokeStyle='#67728a';c.lineWidth=1;c.beginPath();c.moveTo(0,-7);c.lineTo(-5,-15);c.moveTo(0,-7);c.lineTo(5,-15);c.stroke();c.restore()}
for(const p of stars){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=18*dt;p.life-=dt;c.globalAlpha=Math.max(0,Math.min(1,p.life));c.fillStyle=p.color;c.save();c.translate(p.x,p.y);c.rotate(time);c.beginPath();for(let j=0;j<8;j++){let a=j*Math.PI/4,r=j%2?p.size*.3:p.size;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.closePath();c.fill();c.restore()}c.globalAlpha=1;stars=stars.filter(p=>p.life>0)}
function frame(now){const dt=Math.min((now-last)/1000||0,.04);last=now;draw(dt);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
